# ============================================================
# Docker Compose Production Configuration (Target B: On-Premise)
# Project: Online Library Management System
# ============================================================

services:
  # ----------------------------------------------------------
  # 1. Production Database Service (MySQL 8.0)
  # ----------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: library_prod_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-library_db}
      MYSQL_USER: ${MYSQL_USER:-library_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - library-prod-net

  # ----------------------------------------------------------
  # 2. Unified Application Service (Backend + Compiled Frontend)
  # ----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library_prod_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5001
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-library_user}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-library_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    expose:
      - "5001"
    networks:
      - library-prod-net

  # ----------------------------------------------------------
  # 3. Nginx Reverse Proxy & Load Balancer
  # ----------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: library_prod_nginx
    restart: always
    depends_on:
      - app
    ports:
      - "${PROD_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - library-prod-net

# ------------------------------------------------------------
# Volumes & Networks
# ------------------------------------------------------------
volumes:
  mysql_prod_data:
    driver: local

networks:
  library-prod-net:
    driver: bridge
