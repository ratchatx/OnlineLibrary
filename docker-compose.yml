services:
  # ----------------------------------------------------
  # 1. Database Service: MySQL 8.0
  # Service name: "db" — containers connect via db:3306
  # ----------------------------------------------------
  db:
    image: mysql:8.0
    container_name: library_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - library-net

  # ----------------------------------------------------
  # 2. Database Admin Service: phpMyAdmin
  # ----------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: library_phpmyadmin
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"
    networks:
      - library-net

  # ----------------------------------------------------
  # 3. Backend Service: Node.js 20 + Express 4
  # Port: 5001
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: library_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${BACKEND_PORT:-5001}
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-library_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-library_secret}
      DB_NAME: ${MYSQL_DATABASE:-library_db}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - library-net

  # ----------------------------------------------------
  # 4. Frontend Service: React 18 + Vite 5
  # Port: 5173
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: library_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5001/api/v1}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - library-net

# ------------------------------------------------------
# Volumes & Networks Configuration
# ------------------------------------------------------
volumes:
  mysql_data:
    driver: local

networks:
  library-net:
    driver: bridge
